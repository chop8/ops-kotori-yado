	<!-- BEGIN HOME -->
	<section id="home" class="page">
		<div class="container">
			<div class="content cover text-center">
				<div class="row">

				{if $is_login}
					<div class="col-md-4 offset-md-4 mt-5">
						<h3>パスワードの変更</h3>
						<br />
						{if $is_edited}
						<div class="rowframe01">
							<p>
								パスワードを変更しました。
								<br />
								<a href="{$base_url}">スケジュールページに戻る</a>
							</p>
						</div>
						{else}
						<div class="rowframe01 text-left">
							<form name="login" method="post" action="{$base_url}auth/editpass/" class="form-login">
								<div class="form-group">
									<label>変更パスワード</label>
									<input type="text" class="form-control" id="pass" name="pass" placeholder="パスワード">
								</div>
								<button type="submit" class="btn btn-primary">送 信</button>
							</form>
						</div>
						{/if}
					</div>
				{else}
					<div class="col-lg-12 mt-5">
						<h3>編集モードに切り替えてください</h3>
						<br />
						<p>
							<a href="{$base_url}">スケジュールページに戻る</a>
						</p>
					</div>
				{/if}
				</div>
			</div>
		</div>
	</section>
	<!-- END HOME -->
